<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OmniDebugLink — React Sample</title>
  <style>
    :root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e2e4ed;--muted:#6b7280;--accent:#6366f1;--green:#22c55e;--red:#ef4444}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
    h1{font-size:1.3rem;margin-bottom:2px}
    h2{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;border-bottom:1px solid var(--border);padding-bottom:5px}
    .status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
    .status.connected{background:#166534;color:#bbf7d0}
    .status.disconnected{background:#991b1b;color:#fecaca}
    .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:3px}
    input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:6px 10px;font-size:.85rem;width:100%}
    input[type=checkbox]{width:auto}
    button{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:6px 14px;font-size:.8rem;cursor:pointer}
    button:hover{opacity:.85}
    button.secondary{background:var(--border);color:var(--text)}
    button.danger{background:var(--red)}
    pre{background:#0d0f14;padding:10px;border-radius:6px;font-size:.72rem;overflow-x:auto;max-height:180px;white-space:pre-wrap;word-break:break-all;color:var(--muted)}
    ul{padding-left:20px;color:var(--muted);margin-top:8px;max-height:120px;overflow-y:auto}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
