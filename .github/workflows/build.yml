# Manual release workflow: Actions tab -> build-release -> Run workflow
# Pipeline: build dist -> commit dist to the repo -> tag vX.Y.Z ->
# create Release (with artifacts + SRI hashes)
# Version always comes from source (package.json <-> omnidebuglink.js
# LIB_VERSION, cross-checked at build time); re-running the same version
# fails at the tag check — bump first.
name: build-release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Extra release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build dist
        run: npm run build

      - name: Commit dist
        run: |
          git config user.name  "odl-release-bot"
          git config user.email "noreply@omnidebuglink.dev"
          git add dist
          if git diff --cached --quiet; then
            echo "dist unchanged, skipping commit"
          else
            git commit -m "build: dist v$(node -p "require('./package.json').version")"
          fi

      - name: Check tag is free
        run: |
          git fetch --tags origin
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists — bump package.json + LIB_VERSION first"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Push commit + tag
        run: |
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"

      - name: Render release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "## Install"
            echo
            echo '```html'
            echo "<script src=\"https://cdn.jsdelivr.net/gh/omnidebuglink/omnidebuglink_web@$TAG/dist/omnidebuglink.min.js\"></script>"
            echo "<script>OmniDebugLink.start('wss://api.omnidebuglink.dev/ws?token=<clientToken>')</script>"
            echo '```'
            echo
            echo '```js'
            echo "import { OmniDebugLink } from 'https://cdn.jsdelivr.net/gh/omnidebuglink/omnidebuglink_web@$TAG/dist/omnidebuglink.esm.min.js';"
            echo '```'
            echo
            echo "## Artifacts (html2canvas 1.4.1 bundled)"
            echo
            echo "| File | Size | SRI |"
            echo "|---|---|---|"
            for f in dist/*.js; do
              s=$(wc -c < "$f")
              sri=$(openssl dgst -sha384 -binary "$f" | openssl base64 -A)
              echo "| \`$f\` | $((s/1024)) KB | \`sha384-$sri\` |"
            done
            if [ -n "$NOTES" ]; then
              echo
              echo "## Notes"
              echo
              echo "$NOTES"
            fi
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.js --title "$TAG" --latest --notes-file release-notes.md
